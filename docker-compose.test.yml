services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bakeryflow_test
      POSTGRES_USER: bakeryflow_test
      POSTGRES_PASSWORD: bakeryflow_test_local_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakeryflow_test -d bakeryflow_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
